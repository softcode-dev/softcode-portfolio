<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta
      name="description"
      content="SoftCode_dev — veb-saytlar, Telegram botlar va AI yechimlar ishlab chiqadigan dasturchilar jamoasi. G'oyangizni zamonaviy texnologiyalar bilan haqiqatga aylantiramiz."
    />

    <!-- Open Graph / ijtimoiy tarmoqlar -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SoftCode_dev — Sizning g'oyangiz, bizning kodimiz" />
    <meta
      property="og:description"
      content="Veb-saytlar, Telegram botlar va AI integratsiya. SoftCode_dev jamoasi bilan raqamli loyihangizni boshlang."
    />
    <meta property="og:image" content="/header-logo-2.png" />
    <meta property="og:locale" content="uz_UZ" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>SoftCode_dev — Veb, Bot va AI yechimlar</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('softcode-theme') || 'dark';
          const daisy = theme === 'dark' ? 'night' : 'light';
          document.documentElement.setAttribute('data-theme', daisy);
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
          document.documentElement.style.colorScheme = theme;
          const lang = localStorage.getItem('softcode-lang') || 'uz';
          document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
